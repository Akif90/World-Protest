services:
  db:
    image: postgres:16
    container_name: wpa-postgres
    environment:
      POSTGRES_USER: wpa
      POSTGRES_PASSWORD: wpa
      POSTGRES_DB: wpa
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wpa"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
