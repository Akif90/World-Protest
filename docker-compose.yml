services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: wpa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wpa}
      POSTGRES_DB: wpa
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U wpa" ]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://wpa:${POSTGRES_PASSWORD:-wpa}@db:5432/wpa
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: [ "python", "-m", "app.ingest.scheduler" ]
    environment:
      DATABASE_URL: postgresql+psycopg://wpa:${POSTGRES_PASSWORD:-wpa}@db:5432/wpa
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE-}
    depends_on:
      backend:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      - acme_webroot:/var/www/certbot:ro
    restart: unless-stopped

  certbot:
    image: certbot/certbot:v5.8.0
    profiles: ["tools"]
    volumes:
      - certificates:/etc/letsencrypt
      - acme_webroot:/var/www/certbot

volumes:
  pgdata:
  acme_webroot:
  certificates:
