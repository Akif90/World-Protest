<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#edf3f5" />
    <meta
      name="description"
      content="Live protest and civil-unrest events worldwide on an interactive 3D globe."
    />
    <script>
      try {
        const saved = localStorage.getItem("wpg:theme");
        const theme = saved === "light" || saved === "dark" ? saved
          : window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#10212b" : "#edf3f5";
      } catch { /* The app still provides a toggle when storage is blocked. */ }
    </script>
    <title>World Protest Globe</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
