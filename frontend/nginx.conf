
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Revalidate the app shell and PWA files so deployments reach returning users.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # Vite emits hashed assets; they can be cached for a long time.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React client-side routes should fall back to the application shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
